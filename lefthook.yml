output:
  - meta
  - summary
pre-push:
  parallel: false
  env:
    LEFTHOOK: "1"
  commands:
    common:
      run: npm --prefix ./common/tests run test:lefthook
      skip_empty: true
      follow: true
      skip_on_fail: false
      fail_text: See report ./common/tests/reports/tests-results.html
    tsc-lint-unit-tests:
      run: CI=true FORCE_COLOR=0 pnpm nx run-many -t tsc lint test -p @docspace/client @docspace/login @docspace/doceditor @docspace/management @docspace/sdk @docspace/shared --parallel=3
      skip_empty: true
      follow: true
      skip_on_fail: false
      fail_text: Rerun the failed task from the Nx list above (pnpm run tsc / lint / test / test:client / test:sdk / test:doceditor); shared test report - cd packages/shared && pnpm run test:open-report
    openspec:
      # Only when the pushed commits touch openspec/; the CLI is not a repo
      # dependency, so npx fetches this pinned version on first use.
      glob: "openspec/**"
      run: OPENSPEC_TELEMETRY=0 npx -y @fission-ai/openspec@1.17.0 validate --all --strict
      fail_text: Fix the change or spec named above, then rerun the same command; it validates every change and main spec, not only yours
