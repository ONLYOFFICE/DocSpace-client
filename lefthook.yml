output:
  - meta
  - summary
pre-push:
  parallel: false
  env:
    LEFTHOOK: "1"
  commands:
    common:
      run: VITE_CONFIG_NATIVE_IGNORE_WARNING=true npm --prefix ./common/tests run test:lefthook
      skip_empty: true
      follow: true
      skip_on_fail: false
      fail_text: See report ./common/tests/reports/tests-results.html
    tsc-lint-unit-tests:
      run: CI=true FORCE_COLOR=0 VITE_CONFIG_NATIVE_IGNORE_WARNING=true pnpm nx run-many -t tsc lint test -p @docspace/client @docspace/login @docspace/doceditor @docspace/management @docspace/sdk @docspace/shared --parallel=4
      skip_empty: true
      follow: true
      skip_on_fail: false
      fail_text: Rerun the failed task from the Nx list above (pnpm run tsc / lint / test / test:client / test:sdk); shared test report - cd packages/shared && pnpm run test:open-report
